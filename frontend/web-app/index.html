<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 RuralFarm AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { background: #2e7d32; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .header h1 { font-size: 24px; }
        .header .sub { opacity: 0.9; font-size: 14px; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h3 { color: #2e7d32; margin-bottom: 12px; font-size: 18px; }
        input, select { width: 100%; padding: 10px; margin: 5px 0 12px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { 
            background: #4CAF50; color: white; padding: 12px; border: none; border-radius: 8px; 
            cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 5px;
        }
        button:hover { background: #388E3C; }
        .btn-blue { background: #1976D2; }
        .btn-blue:hover { background: #1565C0; }
        .btn-orange { background: #F57C00; }
        .btn-orange:hover { background: #E65100; }
        .result { 
            margin-top: 12px; padding: 12px; background: #f9f9f9; border-radius: 8px; 
            display: none; border-left: 4px solid #4CAF50;
        }
        .result.show { display: block; }
        .loading { text-align: center; padding: 20px; display: none; }
        .loading.active { display: block; }
        .spinner { 
            border: 4px solid #f3f3f3; border-top: 4px solid #4CAF50; 
            border-radius: 50%; width: 40px; height: 40px; 
            animation: spin 1s linear infinite; margin: 0 auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-high { background: #4CAF50; color: white; }
        .badge-medium { background: #FFA726; color: white; }
        .file-input { 
            padding: 12px; border: 2px dashed #ddd; border-radius: 8px; 
            text-align: center; cursor: pointer; margin-bottom: 12px;
        }
        .file-input.has-file { border-color: #4CAF50; background: #e8f5e9; }
        .error-text { color: #d32f2f; padding: 10px; background: #ffebee; border-radius: 8px; }
        .weather-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .weather-day { background: #f5f5f5; padding: 10px; border-radius: 8px; text-align: center; }
        .market-item { background: #f9f9f9; padding: 10px; margin: 5px 0; border-radius: 8px; border-left: 4px solid #1976D2; }
        hr { margin: 15px 0; border: none; border-top: 2px solid #f0f0f0; }
        .advice-box { background: #e8f5e9; padding: 12px; border-radius: 8px; margin-top: 10px; }
        .advice-box ul { list-style: none; padding: 0; }
        .advice-box li { padding: 4px 0; color: #1b5e20; }
        .disease-result { padding: 12px; border-radius: 8px; margin-top: 8px; }
        .severity-none { background: #e8f5e9; border-left: 4px solid #4CAF50; }
        .severity-low { background: #fff3e0; border-left: 4px solid #FFA726; }
        .severity-medium { background: #fff3e0; border-left: 4px solid #FF6F00; }
        .severity-high { background: #ffebee; border-left: 4px solid #ef5350; }
        .severity-critical { background: #ffebee; border-left: 4px solid #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 RuralFarm AI</h1>
            <div class="sub">Smart Farming Solutions</div>
        </div>

        <div class="card">
            <h3>🌾 Crop Recommendation</h3>
            <form id="cropForm">
                <input type="text" id="location" placeholder="Location" required>
                <select id="soilType" required>
                    <option value="">Soil Type</option>
                    <option value="loamy">Loamy</option>
                    <option value="sandy">Sandy</option>
                    <option value="clay">Clay</option>
                </select>
                <select id="waterAvailability" required>
                    <option value="">Water Availability</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <select id="season" required>
                    <option value="">Season</option>
                    <option value="rainy">Rainy</option>
                    <option value="dry">Dry</option>
                </select>
                <button type="submit">Get Recommendations 🌱</button>
            </form>
            <div id="cropResult" class="result"></div>
            <div id="cropLoading" class="loading"><div class="spinner"></div><p style="margin-top:10px;">Analyzing...</p></div>
        </div>

        <div class="card">
            <h3>🔬 Disease Detection</h3>
            <form id="diseaseForm">
                <div class="file-input" id="fileLabel">📸 Tap to select image</div>
                <input type="file" id="diseaseImage" accept="image/*" style="display:none;" required>
                <button type="submit" class="btn-blue">Analyze Image 🔍</button>
            </form>
            <div id="diseaseResult" class="result"></div>
            <div id="diseaseLoading" class="loading"><div class="spinner"></div><p style="margin-top:10px;">Analyzing image...</p></div>
        </div>

        <div class="card">
            <h3>🌤️ Weather</h3>
            <div style="display:flex; gap:8px;">
                <input type="text" id="weatherLocation" placeholder="Location" style="flex:1;">
                <button onclick="getWeather()" style="width:auto; padding:10px 20px;">Get</button>
            </div>
            <div id="weatherResult"></div>
        </div>

        <div class="card">
            <h3>💰 Market</h3>
            <button onclick="loadMarket()" class="btn-blue">Load Listings</button>
            <div id="marketResult"></div>
            <hr>
            <input type="text" id="processingCrop" placeholder="Crop name (e.g., Tomatoes)" style="margin-bottom:8px;">
            <button onclick="getProcessing()" class="btn-orange">Get Processing Ideas 💡</button>
            <div id="processingResult"></div>
        </div>
    </div>

    <script>
        const API = 'http://127.0.0.1:8000/api/v1';

        document.getElementById('fileLabel').onclick = () => document.getElementById('diseaseImage').click();
        document.getElementById('diseaseImage').onchange = function() {
            const label = document.getElementById('fileLabel');
            if (this.files && this.files[0]) {
                label.textContent = '📷 ' + this.files[0].name;
                label.className = 'file-input has-file';
            }
        };

        document.getElementById('cropForm').onsubmit = async (e) => {
            e.preventDefault();
            const loading = document.getElementById('cropLoading');
            const result = document.getElementById('cropResult');
            loading.className = 'loading active';
            result.className = 'result';

            const data = {
                location: document.getElementById('location').value,
                soil_type: document.getElementById('soilType').value,
                water_availability: document.getElementById('waterAvailability').value,
                season: document.getElementById('season').value
            };

            try {
                const res = await fetch(${API}/recommend, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const resultData = await res.json();
                
                let html = '<h4>🌱 Recommended Crops:</h4>';
                if (resultData.recommendations && resultData.recommendations.length > 0) {
                    resultData.recommendations.forEach(c => {
                        const badge = c.suitability === 'High' ? 'badge-high' : 'badge-medium';
                        const reasons = (c.match_reasons && Array.isArray(c.match_reasons)) 
                            ? c.match_reasons.join(', ') 
                            : 'Good match';
                        html += <div style="padding:8px 0;border-bottom:1px solid #eee;">
                            <strong></strong> <span class="badge "></span>
                            <br><small style="color:#666;"></small>
                            <br><small style="color:#888;">✅ </small>
                        </div>;
                    });
                } else {
                    html += '<p>No recommendations found. Try different inputs.</p>';
                }
                result.innerHTML = html;
                result.className = 'result show';
            } catch(e) {
                result.innerHTML = <p class="error-text">❌ Error: </p>;
                result.className = 'result show';
            }
            loading.className = 'loading';
        };

        document.getElementById('diseaseForm').onsubmit = async (e) => {
            e.preventDefault();
            const loading = document.getElementById('diseaseLoading');
            const result = document.getElementById('diseaseResult');
            loading.className = 'loading active';
            result.className = 'result';

            const file = document.getElementById('diseaseImage').files[0];
            if (!file) { 
                alert('Please select an image first');
                loading.className = 'loading';
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(${API}/detect-disease, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (!data || !data.result) {
                    result.innerHTML = <p class="error-text">❌ No data received from server</p>;
                    result.className = 'result show';
                    loading.className = 'loading';
                    return;
                }

                const r = data.result;
                let severityClass = '';
                const severity = (r.severity || 'Unknown').toLowerCase();
                if (severity === 'none') severityClass = 'severity-none';
                else if (severity === 'low') severityClass = 'severity-low';
                else if (severity === 'medium') severityClass = 'severity-medium';
                else if (severity === 'high') severityClass = 'severity-high';
                else if (severity === 'critical') severityClass = 'severity-critical';
                
                let html = <h4>🔬 Analysis Results</h4>;
                html += <div class="disease-result ">;
                html += <p><strong>Disease:</strong> </p>;
                html += <p><strong>Confidence:</strong> %</p>;
                html += <p><strong>Severity:</strong> </p>;
                html += <div style="margin-top:8px;padding:10px;background:#e8f5e9;border-radius:8px;">
                    <strong>💡 Advice:</strong> 
                </div>;
                if (r.treatment) {
                    html += <div style="margin-top:8px;padding:10px;background:#fff3e0;border-radius:8px;">
                        <strong>🧪 Treatment:</strong> 
                    </div>;
                }
                if (r.prevention) {
                    html += <div style="margin-top:8px;padding:10px;background:#e3f2fd;border-radius:8px;">
                        <strong>🛡️ Prevention:</strong> 
                    </div>;
                }
                html += </div>;
                
                result.innerHTML = html;
                result.className = 'result show';
            } catch(e) {
                result.innerHTML = <p class="error-text">❌ Error: </p>;
                result.className = 'result show';
            }
            loading.className = 'loading';
        };

        async function getWeather() {
            const loc = document.getElementById('weatherLocation').value;
            if (!loc) { alert('Enter location'); return; }
            
            const result = document.getElementById('weatherResult');
            result.innerHTML = '<div class="loading active"><div class="spinner"></div><p style="margin-top:10px;">Loading...</p></div>';

            try {
                const res = await fetch(${API}/weather/);
                const data = await res.json();
                
                if (!data || !data.data) {
                    result.innerHTML = <p class="error-text">❌ No weather data available</p>;
                    return;
                }
                
                const w = data.data;
                let html = <h4>🌤️ </h4>;
                html += <div style="background:#e3f2fd;padding:10px;border-radius:8px;margin:8px 0;">
                    <strong>📊 Summary:</strong> 
                </div>;
                
                if (w.forecast && w.forecast.length > 0) {
                    html += '<div class="weather-grid">';
                    w.forecast.slice(0, 5).forEach(d => {
                        html += <div class="weather-day">
                            <div><strong></strong></div>
                            <div></div>
                            <div>°C</div>
                            <div style="font-size:0.8em;color:#666;">🌧️ mm</div>
                        </div>;
                    });
                    html += '</div>';
                }
                
                try {
                    const adviceRes = await fetch(${API}/advice/);
                    const adviceData = await adviceRes.json();
                    html += <div class="advice-box"><strong>🌱 Farming Advice:</strong><ul>;
                    if (adviceData.advice && Array.isArray(adviceData.advice)) {
                        adviceData.advice.forEach(a => { html += <li></li>; });
                    } else {
                        html += <li>Weather conditions are suitable for farming activities.</li>;
                    }
                    html += '</ul></div>';
                } catch(e) {}
                
                result.innerHTML = html;
            } catch(e) {
                result.innerHTML = <p class="error-text">❌ Error: </p>;
            }
        }

        async function loadMarket() {
            const result = document.getElementById('marketResult');
            result.innerHTML = '<div class="loading active"><div class="spinner"></div><p style="margin-top:10px;">Loading...</p></div>';
            
            try {
                const res = await fetch(${API}/market/listings);
                const data = await res.json();
                
                let html = '<h4>📊 Market Listings</h4>';
                if (data.listings && data.listings.length > 0) {
                    data.listings.forEach(l => {
                        html += <div class="market-item">
                            <strong></strong> - kg at Cyan{l.price || 0}/kg
                            <br><small>📍 </small>
                        </div>;
                    });
                } else {
                    html += '<p>No listings available.</p>';
                }
                result.innerHTML = html;
            } catch(e) {
                result.innerHTML = <p class="error-text">❌ Error: </p>;
            }
        }

        async function getProcessing() {
            const crop = document.getElementById('processingCrop').value;
            if (!crop) { alert('Enter crop name'); return; }
            
            const result = document.getElementById('processingResult');
            result.innerHTML = '<div class="loading active"><div class="spinner"></div><p style="margin-top:10px;">Loading...</p></div>';
            
            try {
                const res = await fetch(${API}/process-suggestion/);
                const data = await res.json();
                
                if (!data || !data.suggestions) {
                    result.innerHTML = <p class="error-text">❌ No processing suggestions available</p>;
                    return;
                }
                
                const s = data.suggestions;
                let html = <h4>🏭 Processing Ideas for </h4>;
                html += <p>💰 Market Price: Cyan{s.market_price || 0}/kg | 📈 </p>;
                
                if (s.products && Array.isArray(s.products)) {
                    s.products.forEach(p => {
                        html += <div style="background:#f9f9f9;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #e0e0e0;">
                            <strong></strong> 
                            <span style="background:#FFA726;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:bold;">💰 x</span>
                            <br><small></small>
                        </div>;
                    });
                } else {
                    html += '<p>No products available for this crop.</p>';
                }
                result.innerHTML = html;
            } catch(e) {
                result.innerHTML = <p class="error-text">❌ Error: </p>;
            }
        }

        window.onload = function() {
            loadMarket();
            document.getElementById('weatherLocation').value = 'Central';
        };
    </script>
</body>
</html>
